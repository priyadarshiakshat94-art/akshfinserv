# GitHub checks the site's packages every week and opens a pull request when one
# has a security fix. Netlify builds a preview of each one, so you can check it before merging.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
