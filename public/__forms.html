<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Detected by Netlify Forms at deploy. Field names must match components/site/book-call-form.tsx. -->
    <form name="book-call" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="mobile" />
      <input type="date" name="date" />
      <input type="text" name="slot" />
      <input type="text" name="topic" />
    </form>
  </body>
</html>
