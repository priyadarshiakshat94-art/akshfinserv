<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"><rect width="1600" height="1000" rx="36" fill="#F5F2EC"/><text x="110" y="140" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="44" font-weight="500" fill="#1E1E1E">Five moments a year to update the page</text><rect x="110" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="162.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Jan</text><rect x="225" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="277.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Feb</text><rect x="340" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="392.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Mar</text><rect x="455" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="507.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Apr</text><rect x="570" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="622.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">May</text><rect x="685" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="737.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Jun</text><rect x="800" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="852.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Jul</text><rect x="915" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="967.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Aug</text><rect x="1030" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="1082.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Sep</text><rect x="1145" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="1197.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Oct</text><rect x="1260" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="1312.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Nov</text><rect x="1375" y="240" width="105" height="90" rx="14" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="1427.5" y="296" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="28" fill="#1E1E1E" text-anchor="middle">Dec</text><circle cx="277.5" cy="285" r="52" fill="none" stroke="#C9A36B" stroke-width="5"/><line x1="277.5" x2="277.5" y1="337" y2="600" stroke="#C9A36B" stroke-width="3"/><text x="257.5" y="640" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#1E1E1E" text-anchor="start">1. After the Union Budget</text><text x="257.5" y="678" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62" text-anchor="start">Did a tax rule change?</text><circle cx="392.5" cy="285" r="52" fill="none" stroke="#C9A36B" stroke-width="5"/><line x1="392.5" x2="392.5" y1="337" y2="410" stroke="#C9A36B" stroke-width="3"/><text x="372.5" y="450" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#1E1E1E" text-anchor="start">2. Before 31 March</text><text x="372.5" y="488" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62" text-anchor="start">Statements are out anyway</text><circle cx="852.5" cy="285" r="52" fill="none" stroke="#C9A36B" stroke-width="5"/><line x1="852.5" x2="852.5" y1="337" y2="600" stroke="#C9A36B" stroke-width="3"/><text x="832.5" y="640" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#1E1E1E" text-anchor="start">3. When you file your return</text><text x="832.5" y="678" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62" text-anchor="start">Income and gains in one place</text><circle cx="1197.5" cy="285" r="52" fill="none" stroke="#C9A36B" stroke-width="5"/><line x1="1197.5" x2="1197.5" y1="337" y2="410" stroke="#C9A36B" stroke-width="3"/><text x="1217.5" y="450" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#1E1E1E" text-anchor="end">4. Your family review date</text><text x="1217.5" y="488" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62" text-anchor="end">An anniversary or a birthday</text><rect x="110" y="820" width="1380" height="110" rx="22" fill="#1E1E1E"/><text x="150" y="887" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="30" fill="#F5F2EC"><tspan fill="#C9A36B">5. Every policy renewal, whenever it falls:</tspan> check the cover and the nominee before paying.</text></svg>