<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"><rect width="1600" height="1000" rx="36" fill="#F5F2EC"/><text x="120" y="150" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="30" letter-spacing="9" fill="#6F6A62">ONE PAGE</text><rect x="120" y="172" width="1080" height="4" fill="#C9A36B"/><text x="120" y="250" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="34" fill="#C9A36B">01</text><text x="210" y="250" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#1E1E1E">Investments</text><text x="210" y="288" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62">Mutual funds, shares, FDs, PPF, EPF, NPS, gold, property</text><line x1="120" x2="1200" y1="320" y2="320" stroke="#DDD6C9" stroke-width="2"/><text x="120" y="354" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="34" fill="#C9A36B">02</text><text x="210" y="354" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#1E1E1E">Insurance</text><text x="210" y="392" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62">Every policy, who it covers, when it renews</text><line x1="120" x2="1200" y1="424" y2="424" stroke="#DDD6C9" stroke-width="2"/><text x="120" y="458" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="34" fill="#C9A36B">03</text><text x="210" y="458" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#1E1E1E">Loans</text><text x="210" y="496" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62">Lender, EMI, what's left, when it ends</text><line x1="120" x2="1200" y1="528" y2="528" stroke="#DDD6C9" stroke-width="2"/><text x="120" y="562" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="34" fill="#C9A36B">04</text><text x="210" y="562" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#1E1E1E">What it's for</text><text x="210" y="600" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62">Retirement, a child's college, emergencies</text><line x1="120" x2="1200" y1="632" y2="632" stroke="#DDD6C9" stroke-width="2"/><text x="120" y="666" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="34" fill="#C9A36B">05</text><text x="210" y="666" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#1E1E1E">When you'll need it</text><text x="210" y="704" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62">A year next to each goal</text><line x1="120" x2="1200" y1="736" y2="736" stroke="#DDD6C9" stroke-width="2"/><text x="120" y="770" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="34" fill="#C9A36B">06</text><text x="210" y="770" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#1E1E1E">Nominees</text><text x="210" y="808" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62">The name on every account and policy</text><line x1="120" x2="1200" y1="840" y2="840" stroke="#DDD6C9" stroke-width="2"/><text x="120" y="874" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="34" fill="#C9A36B">07</text><text x="210" y="874" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="40" font-weight="500" fill="#1E1E1E">Who knows</text><text x="210" y="912" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="25" fill="#6F6A62">One person at home who can find this page</text><path d="M1250 212 h24 v308 h-24" fill="none" stroke="#C9A36B" stroke-width="3"/><text x="1300" y="360" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="27" fill="#1E1E1E">What you have</text><text x="1300" y="396" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="27" fill="#1E1E1E">and owe</text><path d="M1250 524 h24 v416 h-24" fill="none" stroke="#C9A36B" stroke-width="3"/><text x="1300" y="726" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="27" fill="#1E1E1E">What most lists</text><text x="1300" y="762" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="27" fill="#1E1E1E">leave out</text></svg>