<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"><rect width="1600" height="1000" rx="36" fill="#F5F2EC"/><text x="110" y="140" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="44" font-weight="500" fill="#1E1E1E">When will we need the money?</text><line x1="110" x2="1490" y1="300" y2="300" stroke="#1E1E1E" stroke-width="3"/><circle cx="110" cy="300" r="10" fill="#C9A36B"/><text x="110" y="255" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#6F6A62" text-anchor="start">Today</text><circle cx="585" cy="300" r="10" fill="#C9A36B"/><text x="585" y="255" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#6F6A62" text-anchor="middle">3 years</text><circle cx="1060" cy="300" r="10" fill="#C9A36B"/><text x="1060" y="255" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#6F6A62" text-anchor="middle">7 years</text><circle cx="1490" cy="300" r="10" fill="#C9A36B"/><text x="1490" y="255" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#6F6A62" text-anchor="end">10+ years</text><rect x="110" y="350" width="430" height="540" rx="22" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="144" y="420" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="32" font-weight="500" fill="#1E1E1E">Within about 3 years</text><rect x="144" y="440" width="60" height="4" fill="#C9A36B"/><text x="144" y="510" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· Emergency money</text><text x="144" y="558" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· Next year's school fees</text><text x="144" y="606" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· A car, a planned trip</text><text x="144" y="740" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">Usually somewhere steady.</text><text x="144" y="774" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">There may not be time to</text><text x="144" y="808" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">wait out a fall.</text><rect x="585" y="350" width="430" height="540" rx="22" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="619" y="420" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="32" font-weight="500" fill="#1E1E1E">3 to 7 years</text><rect x="619" y="440" width="60" height="4" fill="#C9A36B"/><text x="619" y="510" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· A home down payment</text><text x="619" y="558" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· A wedding</text><text x="619" y="606" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· College starting soon</text><text x="619" y="740" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">Usually a mix, made</text><text x="619" y="774" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">steadier as the date</text><text x="619" y="808" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">comes closer.</text><rect x="1060" y="350" width="430" height="540" rx="22" fill="#FFFFFF" stroke="#DDD6C9" stroke-width="2"/><text x="1094" y="420" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="32" font-weight="500" fill="#1E1E1E">7 years or more</text><rect x="1094" y="440" width="60" height="4" fill="#C9A36B"/><text x="1094" y="510" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· Retirement</text><text x="1094" y="558" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· A young child's college</text><text x="1094" y="606" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="26" fill="#1E1E1E">· Long-term family goals</text><text x="1094" y="740" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">Usually time to ride out</text><text x="1094" y="774" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">falls, so equity is often</text><text x="1094" y="808" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="24" fill="#6F6A62">part of it.</text><text x="110" y="950" font-family="'General Sans','Inter',Helvetica,Arial,sans-serif" font-size="22" fill="#6F6A62">General principles only, not a recommendation for any product. Examples are illustrative.</text></svg>